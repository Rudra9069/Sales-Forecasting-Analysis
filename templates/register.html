<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Sales Forecasting & Analysis Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

    <div class="register-container">
        <div class="register-card horizontal-layout">
            
            <!-- Left Side: Branding -->
            <div class="register-left">
                <div class="branding-content">
                    <div class="logo-placeholder">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <h1>Sales Forecasting & Analysis Dashboard</h1>
                    <p class="branding-subtitle">Empowering your business with AI-driven insights and real-time sales predictions.</p>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="register-right">
                <div class="form-header">
                    <h2>Create your account</h2>
                    <p class="subtitle">Join us to get started.</p>
                </div>

                <form id="registerForm" action="#" method="POST">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <div class="input-wrapper">
                                <i class="far fa-user"></i>
                                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <div class="input-wrapper">
                                <i class="fas fa-phone-alt"></i>
                                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="far fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                        <div class="error-message">Please enter a valid email address.</div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                                <i class="far fa-eye toggle-password" data-target="password"></i>
                            </div>
                            <div class="password-strength">
                                <div class="strength-bar"></div>
                                <div class="strength-bar"></div>
                                <div class="strength-bar"></div>
                            </div>
                            <span class="password-strength-text"></span>
                        </div>

                        <div class="form-group">
                            <label for="confirm_password">Confirm Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-check-circle"></i>
                                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                                <i class="far fa-eye toggle-password" data-target="confirm_password"></i>
                            </div>
                            <div id="match-indicator" class="match-indicator"></div>
                        </div>
                    </div>

                    <button type="submit" class="register-btn">Register</button>
                </form>

                <div class="auth-links">
                    <p>Already have an account? <a href="#">Sign In</a></p>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Link to external JS -->
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
