<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Forecastify</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <!-- Admin Auth CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin_auth.css') }}">
</head>

<body class="admin-body">

    <div class="admin-login-wrapper">
        <div class="admin-card">

            <div class="admin-card-header">
                <div class="admin-logo-wrapper">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Forecastify Logo">
                </div>
                <h2>Admin Authentication</h2>
                <p>Enter your executive credentials to access the admin console.</p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="admin-alert {{ category }}">
                <i
                    class="fas {% if category == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('admin_login') }}" method="POST">
                <div class="admin-form-group">
                    <label for="admin_email">Admin Email</label>
                    <div class="admin-input-wrapper">
                        <i class="fas fa-user-shield admin-input-icon"></i>
                        <input type="email" id="admin_email" name="email" placeholder="admin@forecastify.com" required
                            autocomplete="username">
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="admin_password">Security Password</label>
                    <div class="admin-input-wrapper">
                        <i class="fas fa-key admin-input-icon"></i>
                        <input type="password" id="admin_password" name="password" placeholder="••••••••••••" required
                            autocomplete="current-password">
                        <i class="far fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="admin-submit-btn">
                    <i class="fas fa-sign-in-alt"></i> Authorize Login
                </button>
            </form>

            <div class="admin-card-footer">
                <a href="{{ url_for('home') }}" class="admin-back-link">
                    <i class="fas fa-arrow-left"></i> Return to Store Front
                </a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('admin_password');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    togglePassword.classList.toggle('fa-eye');
                    togglePassword.classList.toggle('fa-eye-slash');
                });
            }
        });
    </script>
</body>

</html>
